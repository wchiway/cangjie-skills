name: SDK Validation (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdk:
    # Opt-in only: requires a trusted Linux runner with an already installed SDK.
    runs-on: [self-hosted, linux, x64, cangjie]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Compile examples and run semantic regressions
        shell: bash
        run: |
          : "${CANGJIE_HOME:?Configure CANGJIE_HOME on the trusted runner}"
          source "$CANGJIE_HOME/envsetup.sh"
          python3 -B skills/cangjie/scripts/test_sdk.py --work-dir "artifacts/sdk-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: sdk-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/sdk-*/results.json
            artifacts/sdk-*/*.log
            artifacts/sdk-*/project/reports-*/**/*.xml
          if-no-files-found: warn
          retention-days: 14
